          <h2>From idea to classroom in three steps</h2>
        </div>
        <div class="steps">
          <div class="step"><div class="num">1</div><h3>Choose</h3><p>Subject, grade, topic, and either a single lesson (15–120 min) or a multi-day unit. Pick a teaching approach: direct instruction, 5E inquiry, problem-based, stations, or seminar.</p></div>
          <div class="step"><div class="num">2</div><h3>Customize</h3><p>Every part can be edited: objectives, vocabulary, timing, activities, teacher notes, differentiation, questions. Minutes re-total automatically as you edit.</p></div>
          <div class="step"><div class="num">3</div><h3>Export &amp; teach</h3><p>Download PowerPoint, Google Slides, Canva, PDF, Word, a student worksheet, a Kahoot/Blooket quiz CSV, or Quizlet flashcards.</p></div>
        </div>
      </div>
    </section>

    <section class="section">

        <div class="section-head">

          <h2>Built around how teachers actually plan</h2>
        </div>
        <div class="features">
          <div class="feature"><div class="fi">⏱️</div><h3>Time-aware planning</h3><p>Say how long you have and every block gets its minutes. A timing bar warns you when you're over or under.</p></div>
          <div class="feature"><div class="fi">🗓️</div><h3>Lessons or full units</h3><p>Build one lecture or a 2–40 day unit that ends with review and assessment days.</p></div>
          <div class="feature"><div class="fi">🧩</div><h3>Problem-based learning</h3><p>Driving questions, team roles, milestones and a public product, laid out day by day.</p></div>
          <div class="feature"><div class="fi">🌍</div><h3>Differentiation included</h3><p>Every lesson includes supports, English-learner scaffolds and extension challenges.</p></div>
          <div class="feature"><div class="fi">📤</div><h3>Upload &amp; improve</h3><p>Drop in your own PowerPoint, Word doc or PDF. Get a quality score and a prioritized list of fixes, or a rebuilt version.</p></div>

    <section class="section alt">
      <div class="container">
        <div class="section-head"><div class="kicker">FAQ</div><h2>Questions teachers ask</h2></div>
        <div class="faq">
          <details><summary>How do I get it into Canva or Google Slides?</summary><p>Choose the Canva or Google Slides export. You'll get a .pptx built for that tool. In Canva, go to Create a design › Import file. In Google Drive, upload it and choose Open with › Google Slides. Everything stays editable.</p></details>
          <details><summary>Can I change what gets generated?</summary><p>Yes. Every title, bullet, minute count, teacher note, vocabulary word and question can be edited. You can also reorder or add blocks and add days to a unit.</p></details>
          <details><summary>What files can I upload to improve?</summary><p>PowerPoint (.pptx), Word (.docx), PDF, and plain text or Markdown. For Canva or Google files, download them as PPTX, PDF or DOCX first. You can also paste text straight in.</p></details>
          <details><summary>Is student data involved?</summary><p>No. LaunchPoint plans lessons and never needs student information. Free-tier lessons are saved only in your own browser.</p></details>
        </div>
